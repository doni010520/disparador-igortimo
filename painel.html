<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disparo Igor Timo</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --tx:#16181d; --mut:#6b7280; --bd:#e5e7eb; --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --bar:#16a34a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#181b21; --tx:#e8eaee; --mut:#9aa1ad; --bd:#2a2f38; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:920px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--mut); margin-bottom:20px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:16px; }
  .lbl { color:var(--mut); font-size:13px; }
  .num { font-size:28px; font-weight:650; font-variant-numeric:tabular-nums; margin-top:4px; }
  .prog { margin:16px 0; }
  .track { height:10px; background:var(--bd); border-radius:99px; overflow:hidden; margin-top:8px; }
  .fill { height:100%; background:var(--bar); width:0; transition:width .6s; }
  .status { display:inline-flex; align-items:center; gap:8px; font-weight:600; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--mut); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td { padding:8px 4px; border-top:1px solid var(--bd); }
  td:last-child { color:var(--mut); text-align:right; white-space:nowrap; }
  h2 { font-size:15px; margin:0 0 8px; }
</style>
</head>
<body>
<main>
  <h1>Disparo Igor Timo</h1>
  <div class="sub">Atualiza a cada 10s · <span id="upd">—</span></div>

  <div class="card">
    <span class="status"><span class="dot" id="dot"></span><span id="status">carregando…</span></span>
    <div class="lbl" id="atual" style="margin-top:6px"></div>
    <div class="prog">
      <div class="lbl"><span id="pct">0%</span> da lista concluída</div>
      <div class="track"><div class="fill" id="fill"></div></div>
    </div>
  </div>

  <div class="grid" style="margin-top:12px">
    <div class="card"><div class="lbl">Enviados</div><div class="num" id="enviados">—</div></div>
    <div class="card"><div class="lbl">Pendentes</div><div class="num" id="pendentes">—</div></div>
    <div class="card"><div class="lbl">Última hora</div><div class="num" id="ultima_hora">—</div></div>
    <div class="card"><div class="lbl">Hoje</div><div class="num" id="hoje">—</div></div>
    <div class="card"><div class="lbl">Opt-out</div><div class="num" id="optout">—</div></div>
    <div class="card"><div class="lbl">Sem WhatsApp</div><div class="num" id="sem_whatsapp">—</div></div>
  </div>

  <div class="card" style="margin-top:12px">
    <h2>Últimos envios</h2>
    <table><tbody id="rec"></tbody></table>
  </div>
</main>
<script>
const k = new URLSearchParams(location.search).get("k") || "";
const fmt = n => n == null ? "—" : n.toLocaleString("pt-BR");
const hora = s => new Date(s).toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"});
async function load() {
  try {
    const d = await (await fetch("api/stats?k=" + encodeURIComponent(k))).json();
    for (const id of ["enviados","pendentes","ultima_hora","hoje","optout","sem_whatsapp"])
      document.getElementById(id).textContent = fmt(d[id]);
    const feito = d.enviados + d.optout + d.sem_whatsapp;
    const pct = d.total ? (feito / d.total * 100) : 0;
    document.getElementById("pct").textContent = pct.toFixed(1) + "%";
    document.getElementById("fill").style.width = pct + "%";
    document.getElementById("status").textContent = d.status;
    const cor = d.status.startsWith("pausado") ? "var(--bad)" : d.status === "concluído" ? "var(--mut)" : "var(--ok)";
    document.getElementById("dot").style.background = cor;
    document.getElementById("atual").textContent =
      d.proximo_em != null ? `Próximo envio em ${d.proximo_em}s` : (d.atual ? `Enviando para ${d.atual}` : "");
    const tb = document.getElementById("rec");
    tb.replaceChildren(...d.recentes.map(r => {
      const tr = document.createElement("tr");
      for (const v of [r.nome || r.numero, hora(r.hora)]) { const td = document.createElement("td"); td.textContent = v; tr.append(td); }
      return tr;
    }));
    document.getElementById("upd").textContent = "atualizado às " + new Date().toLocaleTimeString("pt-BR");
  } catch (e) { document.getElementById("status").textContent = "erro ao carregar"; }
}
load(); setInterval(load, 10000);
</script>
</body>
</html>
